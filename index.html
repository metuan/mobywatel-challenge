<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Nowy mObywatel · prototyp</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Niezależna koncepcja na mObywatel Challenge">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap">
<style>
/* Layout: desktop = big serif statement on the left + phone; phone = app full screen.
   Language borrowed from editorial gov design: heavy text serif for statements, tight grotesk for UI,
   white cards floating on soft gray, one navy for actions, a pill ask bar on every screen. */
:root{
  --bg:#f5f5f6; --surface:#ffffff; --ink:#0c1222; --ink2:#2b3242; --muted:#6b7180; --faint:#9aa0ab; --hair:#ececef; --track:#efeff2;
  --navy:#0b2b6b; --navy-soft:#eaeef7; --blue:#1d5be6; --red:#d42a3e; --green:#1f7a4f; --amber:#b06d0b;
  --shadow:0 1px 2px rgba(12,18,34,.04),0 18px 40px -18px rgba(12,18,34,.18);
  --shadow-s:0 1px 2px rgba(12,18,34,.05),0 6px 16px -8px rgba(12,18,34,.16);
  --serif:"Newsreader","Iowan Old Style","Georgia",serif;
  --sans:"Inter","Helvetica Neue",Arial,system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;font-feature-settings:"ss01","cv11"}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:10px}

/* ---------- Stage (desktop) ---------- */
.stage{min-height:100%;display:grid;grid-template-columns:minmax(320px,520px) auto;justify-content:center;gap:72px;align-items:center;
  padding-block:48px;padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px))}
.rail{display:flex;flex-direction:column;gap:28px;min-width:0}
.rail .mark{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-weight:500;font-size:22px;letter-spacing:-.02em}
.statement{font-family:var(--serif);font-weight:500;font-size:44px;line-height:1.08;letter-spacing:-.035em;margin:0;text-wrap:pretty}
.badge-i{display:inline-grid;place-items:center;vertical-align:middle;width:1.05em;height:1.05em;border-radius:50%;background:var(--surface);box-shadow:var(--shadow-s);margin:0 .06em;position:relative;top:-.06em}
.badge-i.navy{background:var(--navy);color:#fff}
.badge-i svg{width:.5em;height:.5em}
.badge-stack{display:inline-flex;vertical-align:middle;position:relative;top:-.06em;margin:0 .08em}
.badge-stack span{width:4.04em;height:4.04em;border-radius:50%;display:grid;place-items:center;font-family:var(--sans);font-size:.26em;font-weight:700;color:#fff;box-shadow:0 0 0 3px var(--bg);margin-left:-.7em}
.badge-stack span:first-child{margin-left:0}
.demo-k{font-size:13px;font-weight:600;color:var(--ink)}
.flows{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px}
.flows button{display:flex;gap:10px;align-items:baseline;padding:6px 0;font-size:14px;color:var(--ink2)}
.flows button:hover{color:var(--navy);text-decoration:underline;text-underline-offset:3px}
.flows .fn{font-family:var(--serif);color:var(--faint);font-size:15px;min-width:14px}
.seg{display:inline-flex;background:var(--track);border-radius:999px;padding:4px;gap:2px}
.seg button{padding:8px 14px;border-radius:999px;font-size:13.5px;font-weight:500;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-s)}
.seg.full{display:flex}.seg.full button{flex:1;text-align:center}
.laurel{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--muted)}
.disclaimer{font-size:12px;color:var(--faint);max-width:52ch}

.phone{width:392px;height:846px;background:var(--bg);border-radius:52px;position:relative;overflow:hidden;
  box-shadow:0 0 0 10px #101318,0 0 0 11px #2a2e36,0 50px 90px -30px rgba(12,18,34,.45)}
.phone .notch{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:112px;height:32px;background:#101318;border-radius:20px;z-index:60}
@media (max-width:960px){
  .stage{display:block;padding:0}
  .rail{display:none}
  .phone{width:100%;height:100dvh;border-radius:0;box-shadow:none}
  .phone .notch,.statusbar{display:none!important}
}

/* ---------- App shell ---------- */
.app{position:absolute;inset:0;display:flex;flex-direction:column}
.statusbar{height:50px;flex:none;display:flex;justify-content:space-between;align-items:flex-end;padding:0 30px 6px;font-size:14px;font-weight:600}
.topbar{flex:none;display:flex;align-items:center;justify-content:space-between;padding:10px 18px 6px}
.word{font-family:var(--serif);font-weight:500;font-size:21px;letter-spacing:-.025em;display:flex;align-items:center;gap:7px}
.word em{font-style:italic;font-weight:400;color:var(--muted)}
.flag{width:15px;height:10px;border-radius:2px;background:linear-gradient(#fff 50%,var(--red) 50%);box-shadow:0 0 0 1px rgba(12,18,34,.1);flex:none}
.menu-btn{background:var(--surface);box-shadow:var(--shadow-s);border-radius:999px;padding:9px 16px;font-weight:500;font-size:14px}
.round{width:40px;height:40px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow-s);display:grid;place-items:center;color:var(--ink)}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:6px 18px 130px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}

/* ask bar, pinned like the reference */
.askdock{position:absolute;left:14px;right:14px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20}
.askdock::before{content:"";position:absolute;left:-14px;right:-14px;bottom:-40px;height:120px;background:linear-gradient(rgba(245,245,246,0),var(--bg) 55%);z-index:-1;pointer-events:none}
.askbar{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid rgba(12,18,34,.14);border-radius:999px;padding:7px 7px 7px 20px;box-shadow:var(--shadow)}
.askbar input{flex:1;border:0;outline:0;background:none;min-width:0;font-size:15.5px}
.askbar input::placeholder{color:var(--faint)}
.askbar .ib{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--ink)}
.askbar .go{background:var(--navy);color:#fff;width:40px;height:40px}

/* menu overlay */
.menu-bg{position:absolute;inset:0;z-index:45;background:rgba(235,235,238,.6);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:flex;align-items:flex-start;justify-content:flex-end;padding:56px 14px 14px}
.menu{background:var(--surface);border-radius:30px;box-shadow:var(--shadow);width:100%;padding:18px 18px 16px;text-align:center}
.menu .x{margin-left:auto;display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--bg)}
.menu nav{display:flex;flex-direction:column;gap:6px;margin:6px 0 18px}
.menu nav button{font-size:25px;font-weight:500;letter-spacing:-.03em;text-align:center;color:var(--ink)}
.menu nav button[aria-current="page"]{text-decoration:underline;text-underline-offset:5px;text-decoration-thickness:1.5px}
.menu .official{background:var(--bg);border-radius:16px;padding:12px;font-size:11.5px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:6px}

/* ---------- Type ---------- */
.h-xl{font-family:var(--serif);font-weight:500;font-size:46px;line-height:1;margin:22px 0 10px;letter-spacing:-.04em;text-wrap:balance}
.h-l{font-family:var(--serif);font-weight:500;font-size:34px;line-height:1.04;margin:14px 0 10px;letter-spacing:-.035em;text-wrap:balance}
.h-m{font-family:var(--serif);font-weight:500;font-size:23px;line-height:1.1;margin:0;letter-spacing:-.025em;text-wrap:balance}
.sub{color:var(--muted);font-size:16px;margin:0 0 6px}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:30px 2px 12px}
.sec h3{font-size:19px;letter-spacing:-.025em;margin:0;font-weight:600;color:var(--ink)}
.sec button{color:var(--ink2);font-size:14px;font-weight:500;text-decoration:underline;text-underline-offset:3px;text-decoration-color:rgba(12,18,34,.25)}
.lead{color:var(--muted);margin:0 0 18px;font-size:15.5px}
.small{font-size:13.5px;color:var(--muted)}
.tiny{font-size:12px;color:var(--faint)}
.stepk{font-size:13px;color:var(--muted);margin:10px 0 0;font-weight:500}

/* ---------- Cards and rows ---------- */
.card,.list{background:var(--surface);border-radius:26px;box-shadow:var(--shadow)}
.list{overflow:hidden;padding:4px 0}
.row{display:flex;gap:14px;align-items:center;padding:15px 18px;width:100%;position:relative}
.row + .row::before{content:"";position:absolute;top:0;left:18px;right:18px;height:1px;background:var(--hair)}
.row .ic{width:24px;display:grid;place-items:center;flex:none;color:var(--ink2)}
.row .tx{flex:1;min-width:0}
.row .t{font-weight:500;letter-spacing:-.01em}
.row .s{font-size:13.5px;color:var(--muted)}
.row .chev{color:var(--faint)}
button.row:hover{background:#fafafb}
/* status: a dot and a word, never a filled lozenge */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;white-space:nowrap;color:var(--muted)}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.p-red{color:var(--red)} .p-amber{color:var(--amber)} .p-green{color:var(--green)} .p-navy{color:var(--navy)} .p-gray{color:var(--faint)}
.mini{background:var(--bg);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:500;color:var(--ink);display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.days{font-family:var(--serif);font-weight:500;font-size:30px;line-height:1;letter-spacing:-.03em;text-align:right;min-width:48px}
.days small{display:block;font-family:var(--sans);font-size:11px;color:var(--faint);letter-spacing:0;font-weight:500;margin-top:3px}

/* hero card: soft aurora, like the reference demo frames */
.aurora{border-radius:30px;padding:18px;position:relative;overflow:hidden;background:#f3f3f6}
.aurora::before{content:"";position:absolute;inset:-40%;background:
  radial-gradient(40% 35% at 20% 30%,rgba(120,140,255,.38),transparent 70%),
  radial-gradient(35% 30% at 80% 25%,rgba(200,170,255,.35),transparent 70%),
  radial-gradient(40% 35% at 60% 85%,rgba(255,190,200,.30),transparent 70%);filter:blur(10px)}
.aurora > *{position:relative}
.aurora.warm::before{background:radial-gradient(40% 35% at 25% 30%,rgba(255,190,140,.42),transparent 70%),radial-gradient(35% 35% at 80% 70%,rgba(255,160,180,.35),transparent 70%),radial-gradient(30% 30% at 70% 20%,rgba(255,225,150,.4),transparent 70%)}
.aurora.green::before{background:radial-gradient(40% 35% at 25% 30%,rgba(140,215,180,.45),transparent 70%),radial-gradient(35% 35% at 80% 70%,rgba(150,200,255,.35),transparent 70%)}
.aurora.rose::before{background:radial-gradient(40% 35% at 70% 30%,rgba(255,170,190,.42),transparent 70%),radial-gradient(35% 35% at 20% 75%,rgba(190,170,255,.38),transparent 70%)}
.tag{display:inline-block;background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500;box-shadow:var(--shadow-s)}
.inner{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);margin-top:14px}

.moments{display:flex;gap:12px;overflow-x:auto;margin:0 -18px;padding:4px 18px 16px;scrollbar-width:none;scroll-snap-type:x mandatory}
.moments::-webkit-scrollbar{display:none}
.moment{flex:0 0 200px;height:220px;border-radius:28px;padding:16px;display:flex;flex-direction:column;justify-content:space-between;scroll-snap-align:start;position:relative;overflow:hidden;background:#f0f0f3;box-shadow:var(--shadow-s)}
.moment .h-m{font-size:26px}
.moment .tiny{color:var(--ink2)}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mgrid .moment{height:170px;flex:none}

.track{padding:16px 18px}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:12px 0 8px}
.steps i{height:4px;border-radius:2px;background:var(--track)}
.steps i.on{background:var(--navy)}

/* ---------- Buttons ---------- */
.btn{display:flex;justify-content:center;align-items:center;gap:8px;width:100%;background:var(--navy);color:#fff;border-radius:999px;padding:16px 22px;font-weight:500;font-size:16px;text-align:center;letter-spacing:-.01em}
.btn.black{background:var(--ink)}
.btn.ghost{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-s)}
.btn.soft{background:var(--track);color:var(--ink)}
.btn.red{background:var(--red)} .btn.green{background:var(--green)}
.actions{display:flex;flex-direction:column;gap:10px;margin-top:24px}
.actions.row2{flex-direction:row}.actions.row2 .btn{flex:1}
.link{color:var(--ink);font-weight:500;text-decoration:underline;text-underline-offset:3px}

/* ---------- Flow pieces ---------- */
.progress{display:flex;gap:4px;margin:8px 0 2px}
.progress i{flex:1;height:3px;border-radius:2px;background:var(--track)}
.progress i.on{background:var(--ink)}
.field{padding:13px 18px;position:relative}
.field + .field::before{content:"";position:absolute;top:0;left:18px;right:18px;height:1px;background:var(--hair)}
.field .l{font-size:12.5px;color:var(--muted)}
.field .v{font-weight:500;letter-spacing:-.01em}
.field .src{font-size:12px;color:var(--faint);display:flex;gap:5px;align-items:center;margin-top:3px}
.toggle{width:48px;height:30px;border-radius:999px;background:var(--track);position:relative;flex:none;transition:background .15s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle[aria-checked="true"]{background:var(--blue)}
.toggle[aria-checked="true"]::after{transform:translateX(18px)}
.check{width:24px;height:24px;border-radius:7px;border:1.5px solid #cfd2d8;display:grid;place-items:center;flex:none;color:#fff}
.check[aria-checked="true"]{background:var(--blue);border-color:var(--blue)}
.org{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff;flex:none;box-shadow:inset 0 0 0 2px rgba(255,255,255,.35)}
.note{display:flex;gap:10px;align-items:flex-start;background:var(--surface);box-shadow:var(--shadow-s);border-radius:18px;padding:13px 15px;font-size:13.5px;color:var(--ink2)}
.note.amber{color:var(--ink2)} .note.amber svg{color:var(--amber)}
.note.green svg{color:var(--green)} .note.red svg{color:var(--red)}
.done-mark{width:60px;height:60px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;margin:26px 0 4px;box-shadow:var(--shadow-s)}

/* confirm card */
.sheet-bg{position:absolute;inset:0;background:rgba(236,236,240,.65);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);z-index:40;display:flex;align-items:center;padding:18px}
.sheet{background:var(--surface);width:100%;border-radius:28px;padding:22px 20px 18px;box-shadow:var(--shadow);max-height:88%;overflow:auto}
.sheet .q{font-size:14px;font-weight:600;margin-bottom:10px}
.sheet .fields{border:1px solid var(--hair);border-radius:18px}
.face{width:84px;height:84px;border-radius:26px;background:var(--navy-soft);display:grid;place-items:center;color:var(--navy);margin:10px auto 12px}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.06)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:no-preference){.face.scan{animation:pulse 1s ease-in-out infinite}}

/* ---------- Alerts ---------- */
.alert{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;padding:64px 22px 28px;color:#fff}
.alert.red{background:radial-gradient(120% 70% at 50% 0%,#e0485a,#b51d31)} .alert.green{background:radial-gradient(120% 70% at 50% 0%,#2e9465,#17613e)}
.alert .lvl{font-size:13px;font-weight:500;opacity:.9}
.alert h1{font-family:var(--serif);font-weight:500;font-size:58px;line-height:.98;margin:12px 0 14px;letter-spacing:-.045em}
.alert p{margin:0 0 10px;font-size:16.5px;opacity:.95}
.alert .box{background:rgba(255,255,255,.96);color:var(--ink);border-radius:24px;padding:16px 18px;margin-top:10px;box-shadow:0 20px 40px -20px rgba(0,0,0,.35)}
.alert .btn{background:#fff;color:var(--ink)}
.alert .btn.ghost{background:rgba(255,255,255,.14);color:#fff;box-shadow:none}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.levels div{border-radius:18px;padding:12px;font-size:12.5px;font-weight:600;background:var(--surface);box-shadow:var(--shadow-s)}
.levels i{display:block;width:10px;height:10px;border-radius:50%;margin-bottom:8px}
.map{border-radius:26px;overflow:hidden;box-shadow:var(--shadow)}

/* ---------- Chat ---------- */
.chat{display:flex;flex-direction:column;gap:12px}
.msg{max-width:88%;padding:12px 15px;border-radius:22px;font-size:15px}
.msg.me{align-self:flex-end;background:var(--ink);color:#fff;border-bottom-right-radius:8px}
.msg.ai{align-self:flex-start;background:var(--surface);box-shadow:var(--shadow-s);border-bottom-left-radius:8px}
.msg .srcs{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.msg .srcs span{font-size:12px;background:var(--bg);border-radius:999px;padding:4px 10px;color:var(--ink2);display:inline-flex;gap:5px;align-items:center}
.sugs{display:flex;flex-direction:column;gap:8px}
.sug{background:var(--surface);box-shadow:var(--shadow-s);border-radius:18px;padding:14px 16px;font-size:15px;font-weight:500}
.ai-warn{font-size:12.5px;color:var(--muted);margin:0}

/* ---------- Family ---------- */
.people{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.person{background:var(--surface);box-shadow:var(--shadow);border-radius:26px;padding:16px;display:flex;flex-direction:column;gap:10px;min-height:150px;justify-content:space-between}
.face-i{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:14px;color:#fff;flex:none}

/* ---------- Documents ---------- */
.doccard{border-radius:28px;padding:20px;color:#fff;background:radial-gradient(120% 90% at 0% 0%,#24418a,#0b1d47 60%,#081433);min-height:210px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.doccard::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.5) .6px,transparent .7px);background-size:22px 22px;opacity:.25}
.doccard > *{position:relative;z-index:1}
.doccard .h-m{color:#fff}
.qr{width:180px;height:180px;margin:14px auto;background:#fff;border-radius:22px;padding:14px;box-shadow:var(--shadow)}

/* ---------- Easy mode ---------- */
.easy .h-xl{font-size:50px}
.tiles{display:grid;grid-template-columns:1fr;gap:12px}
.tile{background:var(--surface);box-shadow:var(--shadow);border-radius:28px;padding:22px 20px;display:flex;align-items:center;gap:16px;font-size:23px;font-weight:600;letter-spacing:-.02em}
.tile .ic{width:56px;height:56px;border-radius:50%;background:var(--bg);color:var(--ink);display:grid;place-items:center;flex:none}
.bigbtn{font-size:20px;padding:20px}
.speak{display:flex;gap:10px;align-items:center;justify-content:center;background:var(--navy);color:#fff;border-radius:999px;padding:18px;font-size:18px;font-weight:500}

/* ---------- Roadmap ---------- */
.road{display:grid;grid-template-columns:auto 1fr;gap:0 16px}
.road .n{font-family:var(--serif);font-weight:500;font-size:22px;color:var(--faint);padding-top:12px}
.road .b{border-bottom:1px solid var(--hair);padding:13px 0}

.toast{position:absolute;left:16px;right:16px;bottom:96px;background:var(--ink);color:#fff;border-radius:20px;padding:13px 16px;font-size:14px;z-index:50;box-shadow:var(--shadow)}
.offline{background:var(--surface);box-shadow:var(--shadow-s);border-radius:18px;font-size:13.5px;padding:12px 15px;display:flex;gap:8px;align-items:center;margin-top:8px}

/* ===== v3: Airbnb-like calm: white app, hairline cards, drawn illustrations, no gradient blobs ===== */
:root{--app:#ffffff;--line:#e6e6ea;--green-soft:#e8f4ee;--amber-soft:#fbf1e1;--red-soft:#fbe9eb;--purple:#6b3fa0;--purple-soft:#f1ebf8}
.phone,.app{background:var(--app)}
.askdock::before{background:linear-gradient(rgba(255,255,255,0),#fff 55%)}
.card,.list{box-shadow:none;border:1px solid var(--line)}
.person{box-shadow:none;border:1px solid var(--line)}
.tile{box-shadow:none;border:1px solid var(--line)}
.note{box-shadow:none;border:1px solid var(--line)}
.sug{box-shadow:none;border:1px solid var(--line)}
.msg.ai{box-shadow:none;border:1px solid var(--line)}
.levels div{box-shadow:none;border:1px solid var(--line)}
.offline{box-shadow:none;border:1px solid var(--line)}
.map{box-shadow:none;border:1px solid var(--line)}
.mini{background:#f2f2f4}
.btn.ghost{box-shadow:none;border:1px solid var(--ink)}
.btn.soft{background:#f2f2f4}
.menu-btn,.round{box-shadow:none;border:1px solid var(--line)}
.aurora{background:#f6f7fb}.aurora::before{display:none}
.aurora.warm{background:#fdf3e7}.aurora.green{background:#ecf6f0}.aurora.rose{background:#fdf0ef}
.ill{display:block}
.hero-ill{border-radius:24px;display:grid;place-items:center;height:168px;margin:10px 0 4px}
.bg-sky{background:#eef3fd}.bg-sand{background:#fbf3e4}.bg-mint{background:#eaf6ef}.bg-rose{background:#fdeeec}.bg-yellow{background:#fff6dc}.bg-gray{background:#f4f4f6}
/* listing-style cards */
.mcard{display:flex;flex-direction:column;gap:8px;flex:0 0 164px;scroll-snap-align:start;text-align:left}
.mcard .mimg{border-radius:20px;aspect-ratio:1/1;display:grid;place-items:center;overflow:hidden}
.mcard .mt{font-weight:600;font-size:15px;letter-spacing:-.01em;line-height:1.2}
.mcard .ms{font-size:13px;color:var(--muted);line-height:1.3}
.mrow{display:flex;gap:14px;overflow-x:auto;margin:0 -18px;padding:2px 18px 8px;scrollbar-width:none;scroll-snap-type:x mandatory}
.mrow::-webkit-scrollbar{display:none}
.mgrid2{display:grid;grid-template-columns:1fr 1fr;gap:18px 14px}
.mgrid2 .mcard{flex:none}
/* urgent card */
.urgent{display:flex;gap:14px;align-items:center;border:1px solid var(--line);border-radius:22px;padding:12px 16px 12px 12px;width:100%;margin-top:18px}
.urgent .ui{width:72px;height:60px;border-radius:14px;display:grid;place-items:center;flex:none}
.urgent .k{font-size:12px;font-weight:600;color:var(--red);letter-spacing:.02em;text-transform:uppercase}
/* category strip (icon + label, underline when active) */
.cats{display:flex;gap:22px;overflow-x:auto;margin:6px -18px 0;padding:0 18px;border-bottom:1px solid var(--line);scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cats button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 0 10px;font-size:12px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.cats button[aria-pressed="true"]{color:var(--ink);border-color:var(--ink)}
/* icon tile in rows */
.it{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}

/* ===== Alert RCB ===== */
.rcb-screen{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;padding:58px 14px 22px;color:#fff;
  background:radial-gradient(90% 45% at 50% 0%,rgba(212,42,62,.55),transparent 70%),#0e1016;overflow-y:auto}
.rcb-screen.clear{background:radial-gradient(90% 45% at 50% 0%,rgba(31,122,79,.55),transparent 70%),#0e1016}
.rcb-clock{text-align:center;font-family:var(--serif);font-size:64px;font-weight:400;letter-spacing:-.03em;line-height:1;margin:8px 0 4px;opacity:.95}
.rcb-date{text-align:center;font-size:14px;opacity:.7;margin-bottom:18px}
.rcb{background:rgba(255,255,255,.96);color:var(--ink);border-radius:22px;padding:14px 16px;box-shadow:0 20px 50px -20px rgba(0,0,0,.6)}
.rcb .hd{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;letter-spacing:.02em}
.rcb .hd .b{width:22px;height:22px;border-radius:6px;background:var(--red);color:#fff;display:grid;place-items:center}
.rcb.clear .hd .b{background:var(--green)}
.rcb .hd .tm{margin-left:auto;color:var(--muted);font-weight:500}
.rcb .ttl{font-weight:700;margin:8px 0 2px;font-size:15.5px}
.rcb .bd{font-size:14.5px;line-height:1.4}
.rcb .sig{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--green);margin-top:8px;font-weight:500}
.rcb-app{background:#fff;color:var(--ink);border-radius:22px;padding:6px 0;margin-top:10px}
.rcb-app .lbl{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted);padding:8px 16px 2px}
.rcb-screen .btn.ghost{background:rgba(255,255,255,.12);color:#fff;border:0}
.rcb-screen .btn{background:#fff;color:var(--ink)}
.lvl-chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;border-radius:999px;padding:4px 10px}
.feed .row{align-items:flex-start}
.sig-row{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:center}

/* ===== How it works ===== */
.how-btn{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:999px;padding:8px 11px;font-size:12.5px;font-weight:500;margin-right:6px}
.tb-right{display:flex;align-items:center}
.tech{background:#fff;border:1px solid var(--line);border-radius:26px;padding:20px 20px 16px}
.tech .eyebrow{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.tech h3{font-family:var(--serif);font-weight:500;font-size:26px;letter-spacing:-.03em;margin:4px 0 14px;line-height:1.05}
.tnode{display:grid;grid-template-columns:28px 1fr;gap:12px;position:relative;padding-bottom:14px}
.tnode:not(:last-child)::before{content:"";position:absolute;left:13.5px;top:28px;bottom:2px;width:1px;background:var(--line)}
.tnode .dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600;border:1px solid var(--line);background:#fff}
.tnode .sys{font-weight:600;font-size:14px;letter-spacing:-.01em;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tnode .what{font-size:13.5px;color:var(--ink2);margin-top:2px;line-height:1.4}
.tag-j{font-size:11px;font-weight:600;border-radius:999px;padding:2px 8px;background:var(--green-soft);color:var(--green)}
.tag-n{font-size:11px;font-weight:600;border-radius:999px;padding:2px 8px;background:var(--navy-soft);color:var(--navy)}
.tag-a{font-size:11px;font-weight:600;border-radius:999px;padding:2px 8px;background:var(--purple-soft);color:var(--purple)}
.tech .legend{display:flex;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:12px;margin-top:2px}
.stage.wide{grid-template-columns:minmax(300px,440px) auto minmax(300px,360px);gap:56px}
.side{align-self:center;max-height:846px;overflow:auto}
@media (max-width:1279px){.side{display:none}.stage.wide{grid-template-columns:minmax(320px,520px) auto}}
@media (min-width:1280px){.how-btn{display:none}}
.statement{font-size:40px}
.sheet .tech{border:0;padding:4px 2px}

/* ===== v4 layout: explainer left, demo list right ===== */
.stage.wide{grid-template-columns:minmax(300px,440px) auto minmax(190px,250px);gap:64px;align-items:center}
.rail{gap:26px}
.statement{font-size:34px;line-height:1.1}
.explain .tech{background:transparent;border:0;padding:0}
.explain .tech h3{font-size:30px}
.explain .tnode .dot{background:var(--bg)}
.explain .tnode:not(:last-child)::before{background:#dcdce2}
.explain .legend{border-color:#dcdce2}
.side{max-height:none;overflow:visible;display:flex;flex-direction:column}
.side .flows{display:flex;flex-direction:column;gap:0;margin-top:10px;border-top:1px solid #dcdce2}
.side .flows button{padding:10px 0;border-bottom:1px solid #dcdce2;font-size:14px;align-items:center;transition:color .15s}
.side .flows button[aria-current="step"]{color:var(--ink);font-weight:600}
.side .flows button[aria-current="step"] .fn{color:var(--red)}
.side .flows .fn{font-family:var(--sans);font-size:11.5px;font-weight:600;letter-spacing:.04em;min-width:22px}
@media (max-width:1279px){
  .stage.wide{grid-template-columns:minmax(300px,480px) auto;grid-template-areas:"rail phone" "side phone";gap:24px 56px}
  .stage.wide .rail{grid-area:rail;align-self:end}.stage.wide .phone{grid-area:phone}.stage.wide .side{grid-area:side;display:flex;align-self:start}
  .side .flows{display:grid;grid-template-columns:1fr 1fr;column-gap:18px}
}
@media (min-width:961px){.how-btn{display:none!important}}
@media (max-width:960px){.how-btn{display:inline-flex!important}.side{display:none!important}}

/* ===== Lock screen with live notifications ===== */
.lock{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;padding:54px 12px 18px;color:#fff;overflow:hidden;
  background:linear-gradient(180deg,#1b2a4a 0%,#34466e 45%,#7c6f86 78%,#c7a08c 100%)}
.skyline{position:absolute;left:0;right:0;bottom:0;width:100%;height:160px;pointer-events:none}
.lk-top{text-align:center;position:relative}
.lk-top > span{opacity:.8}
.lk-clock{font-family:var(--serif);font-size:78px;line-height:1;letter-spacing:-.03em;font-weight:500;margin-top:2px;font-variant-numeric:tabular-nums}
.lk-date{font-size:15px;opacity:.85;margin:4px 0 14px;font-weight:500}
.live{position:relative;display:block;width:100%;background:rgba(10,12,18,.78);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:24px;padding:12px 14px;color:#fff;margin-bottom:8px}
.lv-h{display:flex;align-items:center;gap:8px;font-size:13px}
.lv-h .lv-t{margin-left:auto;font-variant-numeric:tabular-nums;color:#ff8a8a;font-weight:600}
.lv-dot{width:8px;height:8px;border-radius:50%;background:#ff4d5e;box-shadow:0 0 0 0 rgba(255,77,94,.6)}
.lv-fam{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:10px 0 8px}
.lfam{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px}
.lfam .av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:11.5px;font-weight:700;position:relative}
.lfam .st{position:absolute;right:-2px;bottom:-2px;width:13px;height:13px;border-radius:50%;border:2.5px solid #14161c;background:#8a8f99;transition:background .3s}
.lfam .st.ok{background:#3ccf7e}.lfam .st.warn{background:#ffb020}
.lfam .nm{font-weight:600}.lfam .ss{opacity:.65}
.lv-bar{height:4px;border-radius:2px;background:rgba(255,255,255,.15);overflow:hidden}
.lv-bar i{display:block;height:100%;background:#3ccf7e;border-radius:2px;transition:width .6s cubic-bezier(.22,1,.36,1)}
.lv-f{font-size:11.5px;opacity:.7;margin-top:7px}
.nstack{display:flex;flex-direction:column;gap:8px}
.notif{display:block;width:100%;text-align:left;background:rgba(245,245,247,.78);backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4);color:var(--ink);border-radius:22px;padding:11px 14px 12px}
.notif.big{background:rgba(255,255,255,.94)}
.notif .nh{display:flex;align-items:center;gap:8px;font-size:12px;color:#5b6170}
.notif.big .nh{color:var(--red);font-weight:600}
.notif .nt{margin-left:auto;font-weight:400;color:#5b6170}
.nicon{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;flex:none}
.nicon.mob{background:#fff;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.notif .ntt{font-weight:600;font-size:14.5px;margin-top:4px;letter-spacing:-.01em}
.notif .nb{font-size:14px;line-height:1.35;color:#2b3242}
.notif .nact{margin-top:8px;border-top:1px solid rgba(0,0,0,.08);padding-top:8px;font-size:13.5px;font-weight:600;color:var(--blue)}
.notif .nact span{display:inline-flex;gap:6px;align-items:center}
.lk-foot{display:flex;justify-content:space-between;gap:10px;position:relative}
.lk-btn{display:inline-flex;gap:6px;align-items:center;background:rgba(255,255,255,.18);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:#fff;border-radius:999px;padding:10px 14px;font-size:13px;font-weight:500}

/* ===== Motion (ease-out for entrances, short, interruptible; nothing on reduced motion) ===== */
:root{--ease-out:cubic-bezier(.23,1,.32,1);--ease-drawer:cubic-bezier(.32,.72,0,1);--ease-spring:cubic-bezier(.34,1.36,.64,1)}
@media (prefers-reduced-motion:no-preference){
  .screen{animation:scr-in .32s var(--ease-out) both}
  .screen.back{animation-name:scr-back}
  @keyframes scr-in{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
  @keyframes scr-back{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
  .screen.tab{animation-name:fade-up}
  @keyframes fade-up{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .screen .list > *,.screen .mrow > *,.screen .mgrid2 > *,.screen .people > *,.screen .tiles > *{animation:fade-up .42s var(--ease-out) both}
  .screen .list > *:nth-child(2),.screen .mrow > *:nth-child(2),.screen .mgrid2 > *:nth-child(2),.screen .people > *:nth-child(2),.screen .tiles > *:nth-child(2){animation-delay:.04s}
  .screen .list > *:nth-child(3),.screen .mrow > *:nth-child(3),.screen .mgrid2 > *:nth-child(3),.screen .people > *:nth-child(3),.screen .tiles > *:nth-child(3){animation-delay:.08s}
  .screen .list > *:nth-child(n+4),.screen .mrow > *:nth-child(n+4),.screen .mgrid2 > *:nth-child(n+4),.screen .people > *:nth-child(n+4),.screen .tiles > *:nth-child(n+4){animation-delay:.12s}
  button,.btn,.mcard,.row,.notif,.live{transition:transform .16s var(--ease-out),background-color .2s,color .2s,box-shadow .2s}
  .btn:active,.mini:active,.menu-btn:active,.round:active,.lk-btn:active,.seg button:active{transform:scale(.97)}
  .mcard:active,.notif:active,.live:active,.urgent:active{transform:scale(.985)}
  .mcard .mimg .ill{transition:transform .5s var(--ease-out)}
  .mcard:hover .mimg .ill{transform:translateY(-3px) scale(1.03)}
  .sheet-bg{animation:fade .2s ease-out both}
  .sheet{animation:sheet-in .38s var(--ease-drawer) both}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes sheet-in{from{opacity:0;transform:translateY(24px) scale(.98)}to{opacity:1;transform:none}}
  .menu-bg{animation:fade .2s ease-out both}
  .menu{transform-origin:top right;animation:menu-in .3s var(--ease-out) both}
  @keyframes menu-in{from{opacity:0;transform:scale(.94) translateY(-6px)}to{opacity:1;transform:none}}
  .menu nav button{animation:fade-up .36s var(--ease-out) both}
  .menu nav button:nth-child(2){animation-delay:.025s}.menu nav button:nth-child(3){animation-delay:.05s}.menu nav button:nth-child(4){animation-delay:.075s}.menu nav button:nth-child(5){animation-delay:.1s}.menu nav button:nth-child(n+6){animation-delay:.125s}
  .toast{animation:toast-in .34s var(--ease-out) both}
  @keyframes toast-in{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
  .notif{animation:notif-in .55s var(--ease-spring) both}
  .notif.big{animation:notif-in .55s var(--ease-spring) both,buzz .42s .5s ease-in-out}
  @keyframes notif-in{from{opacity:0;transform:translateY(-28px) scale(.94)}to{opacity:1;transform:none}}
  @keyframes buzz{0%,100%{transform:none}20%{transform:translateX(-4px)}40%{transform:translateX(4px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
  .live{animation:live-in .6s var(--ease-drawer) both}
  @keyframes live-in{from{opacity:0;transform:scale(.9);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}
  .lv-dot{animation:ping 1.6s ease-out infinite}
  @keyframes ping{0%{box-shadow:0 0 0 0 rgba(255,77,94,.6)}100%{box-shadow:0 0 0 10px rgba(255,77,94,0)}}
  .rcb{animation:notif-in .55s var(--ease-spring) both}
  .rcb-app{animation:fade-up .5s .25s var(--ease-out) both}
  .done-mark{animation:pop .5s .15s var(--ease-spring) both}
  @keyframes pop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
  .check svg path{stroke-dasharray:24;animation:draw .26s var(--ease-out) both}
  @keyframes draw{from{stroke-dashoffset:24}to{stroke-dashoffset:0}}
  .mpin{animation:pin-in .5s var(--ease-spring) both}
  @keyframes pin-in{from{opacity:0}to{opacity:1}}
  .explain{animation:fade-up .4s var(--ease-out) both}
  .explain .tnode{animation:fade-up .45s var(--ease-out) both}
  .explain .tnode:nth-child(3){animation-delay:.05s}.explain .tnode:nth-child(4){animation-delay:.1s}.explain .tnode:nth-child(5){animation-delay:.15s}.explain .tnode:nth-child(n+6){animation-delay:.2s}
  .hero-ill .ill{animation:float-in .7s var(--ease-out) both}
  @keyframes float-in{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}
  .toggle,.toggle::after,.check{transition:transform .2s var(--ease-out),background-color .2s ease,box-shadow .2s ease,opacity .2s ease}
}

/* ===== v5: review pass (paper app, calmer type, one neutral tile, one blue) ===== */
:root{--app:#f4f4f1;--line:#e4e4df;--blue:#0b2b6b;--tile:#efeee9}
.phone,.app{background:var(--app)}
.card,.list,.person,.tile,.note,.sug,.msg.ai,.levels div,.offline,.map,.urgent{background:#fff;border:1px solid var(--line);border-radius:16px}
.list{padding:0}
.row{padding:16px}
.row + .row::before,.field + .field::before{left:16px;right:0}
.h-xl{font-weight:400;font-size:38px;line-height:1.08;letter-spacing:-.02em;margin:6px 0 22px}
.h-l{font-weight:400;font-size:30px;line-height:1.1;letter-spacing:-.015em}
.h-m{font-weight:400;letter-spacing:-.01em}
.statement{font-weight:400;font-size:36px;line-height:1.16;letter-spacing:-.02em}
.sec{margin:32px 2px 12px}
.sec h3{font-size:17px;font-weight:600;letter-spacing:-.01em}
.sec button{text-decoration:none;color:var(--muted);font-size:14px}
.dateline{font-size:13px;font-weight:500;color:var(--muted);margin-top:14px}
.menu-btn{border:0;background:none;padding:8px 4px;font-size:15px}
.round{background:#fff}
.bg-sky,.bg-sand,.bg-mint,.bg-rose,.bg-yellow,.bg-gray{background:var(--tile)}
.mcard .mimg{border-radius:12px}
.mrow .mcard{flex-basis:140px}
.spot{margin:14px 0 -2px}
.spot .ill{margin-left:-6px}
/* urgent */
.urgent{display:flex;align-items:center;gap:8px;padding:16px;margin-top:0}
.urgent .k{display:flex;align-items:center;gap:7px;text-transform:none;letter-spacing:0;font-size:13px;font-weight:600;color:var(--red)}
.urgent .k::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--red)}
.urgent .ut{font-size:17px;font-weight:600;letter-spacing:-.01em;margin:6px 0 2px;line-height:1.25}
.urgent .ui{width:auto;height:auto;background:none}
.tlink{display:inline-flex;align-items:center;gap:6px;margin-top:12px;font-weight:600;color:var(--navy);font-size:15px}
.due{font-size:15px;font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--ink)}
.due.amber{color:var(--amber)}.due.red{color:var(--red)}
.steps i{height:3px}
/* monograms */
.org{width:40px;height:40px;border-radius:10px;background:#f1f1ee;color:var(--ink);font-size:11px;font-weight:600;letter-spacing:.02em;box-shadow:none}
.check{border-radius:6px}
.check[aria-checked="true"]{background:var(--navy);border-color:var(--navy)}
.toggle[aria-checked="true"]{background:var(--navy)}
.it{border-radius:10px;background:#f1f1ee!important;color:var(--ink)!important}
/* dock */
.askdock::before{background:var(--app);left:-14px;right:-14px;bottom:-24px;height:90px}
.askbar{height:50px;border-radius:14px;border:1px solid #d9d9d4;box-shadow:none;padding:0 6px 0 14px;gap:8px;transition:border-color .15s}
.askbar:focus-within{border-color:var(--ink)}
.askbar .sg{color:var(--muted);display:grid}
.askbar .go{width:36px;height:36px;border-radius:10px;animation:fade .16s ease-out}
.scroll{padding-bottom:96px}
/* rail */
.tech .eyebrow{text-transform:none;letter-spacing:0;font-size:13px;font-weight:500}
.tag-j,.tag-n,.tag-a{background:none!important;padding:0;font-size:12px;font-weight:500;display:inline-flex;align-items:center;gap:5px}
.tag-j::before,.tag-n::before,.tag-a::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.tag-j{color:var(--green)}.tag-n{color:var(--navy)}.tag-a{color:var(--purple)}
.tech .legend{gap:16px}
/* alert screens: flat, sans clock, red rule */
.rcb-screen,.rcb-screen.clear{background:#0f1012}
.rcb-clock{font-family:var(--sans);font-weight:200;font-size:72px;letter-spacing:-.02em}
.rcb{border-radius:18px;border-top:3px solid var(--red)}
.rcb.clear{border-top-color:var(--green)}
.rcb-app{border-radius:18px}
.lk-clock{font-family:var(--sans);font-weight:200;font-size:80px;letter-spacing:-.02em}
.how-btn{width:38px;height:38px;padding:0;justify-content:center;background:#fff}
.done-mark{border-color:var(--app)!important}
.screen.full{position:absolute;inset:0;z-index:30;animation:fade .25s ease-out both}

/* ===== v6: native iOS language (Wallet / Health / Settings), sans only ===== */
:root{--sys:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Helvetica Neue",Arial,sans-serif;--disp:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Helvetica Neue",Arial,sans-serif;
  --app:#f2f2f7;--tint:#0a58d0;--sep:rgba(60,60,67,.18);--label2:rgba(60,60,67,.62);--fill:rgba(118,118,128,.12);--line:transparent;--navy:#0a58d0;--blue:#0a58d0;--tile:#ffffff}
body,.app,button,input{font-family:var(--sys)}
body{letter-spacing:-.008em}
.stage{background:#f5f5f7}
/* titles */
.h-xl{font-family:var(--disp);font-weight:700;font-size:34px;line-height:1.12;letter-spacing:-.022em;margin:2px 0 12px}
.h-l{font-family:var(--disp);font-weight:700;font-size:28px;line-height:1.14;letter-spacing:-.02em;margin:10px 0 10px}
.h-m{font-family:var(--disp);font-weight:600;font-size:20px;letter-spacing:-.015em}
.moment .h-m{font-size:20px}
.dateline{font-size:13px;font-weight:600;letter-spacing:.01em;text-transform:uppercase;color:var(--label2);margin:6px 0 0}
.lead{color:var(--label2);font-size:16px}
.small,.row .s,.field .l,.mcard .ms{color:var(--label2)}
.stepk{font-size:13px;font-weight:600;color:var(--label2);text-transform:uppercase;letter-spacing:.01em}
.sec{margin:28px 4px 8px}
.sec h3{font-family:var(--disp);font-size:22px;font-weight:700;letter-spacing:-.02em}
.sec button{color:var(--tint);font-size:16px;font-weight:400}
/* top bar */
.topbar{padding:6px 16px 4px;min-height:44px}
.word{font-family:var(--disp);font-size:17px;font-weight:600;letter-spacing:-.01em;gap:8px}
.navback{display:flex;align-items:center;gap:0;color:var(--tint);font-size:17px;margin-left:-8px}
.avatar-btn{width:34px;height:34px;border-radius:50%;background:linear-gradient(#5b7fbf,#2f4f8f);color:#fff;font-size:13px;font-weight:600;display:grid;place-items:center}
.how-btn{width:34px;height:34px;border:0;background:var(--fill);color:var(--tint)}
.menu-btn{color:var(--tint);font-weight:400;font-size:17px}
/* search */
.search{display:flex;align-items:center;gap:6px;background:var(--fill);border-radius:10px;height:38px;padding:0 8px 0 10px;color:var(--label2);margin:4px 0 6px}
.search input{flex:1;border:0;outline:0;background:none;font-size:17px;min-width:0;color:var(--ink)}
.search input::placeholder{color:var(--label2)}
.search button{color:var(--label2);display:grid}
/* grouped inset lists */
.card,.list,.person,.tile,.note,.sug,.msg.ai,.levels div,.offline,.map,.urgent,.urgent:active{background:#fff;border:0;border-radius:12px;box-shadow:none}
.row{padding:11px 16px;min-height:52px}
.row .t{font-size:17px;font-weight:400;letter-spacing:-.02em}
.row .s{font-size:15px}
.row + .row::before,.field + .field::before{height:.5px;background:var(--sep);left:16px}
.row:has(.it) + .row::before,.row:has(.org) + .row::before,.row:has(.face-i) + .row::before{left:66px}
button.row:hover{background:#fff}
button.row:active{background:#e5e5ea}
.row .chev{color:#c4c4c7}
.it{width:30px;height:30px;border-radius:7px;background:var(--tint)!important;color:#fff!important}
.it svg{width:18px;height:18px}
.field{padding:11px 16px}
.field .v{font-size:17px;font-weight:400}
.note{color:var(--ink);font-size:15px}
.pill{font-size:15px;font-weight:400}
.pill::before{width:8px;height:8px}
/* buttons */
.btn{border-radius:14px;padding:15px 20px;font-size:17px;font-weight:600;background:var(--tint)}
.btn.ghost{background:#fff;color:var(--tint);border:0}
.btn.soft{background:var(--fill);color:var(--tint)}
.btn.black{background:#000}
.mini{background:var(--fill);color:var(--tint);font-weight:600;font-size:15px;padding:6px 14px}
.link,.tlink{color:var(--tint)}
.seg{background:var(--fill);border-radius:9px;padding:2px}
.seg button{border-radius:7px;font-size:13px;font-weight:600;color:var(--ink);padding:6px 12px}
.seg button[aria-pressed="true"]{box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04)}
.toggle{width:51px;height:31px;background:#e9e9eb}.toggle::after{width:27px;height:27px;top:2px;left:2px;box-shadow:0 3px 8px rgba(0,0,0,.15),0 3px 1px rgba(0,0,0,.06)}
.toggle[aria-checked="true"]{background:#34c759}.toggle[aria-checked="true"]::after{transform:translateX(20px)}
.check{border-radius:50%;border:1.5px solid #c7c7cc}.check[aria-checked="true"]{background:var(--tint);border-color:var(--tint)}
.org{border-radius:8px;width:36px;height:36px;background:var(--fill);font-size:10.5px}
/* tab bar */
.tabbar{flex:none;display:grid;grid-template-columns:repeat(5,1fr);padding:6px 4px calc(24px + env(safe-area-inset-bottom,0px));background:rgba(249,249,249,.86);backdrop-filter:saturate(1.8) blur(20px);-webkit-backdrop-filter:saturate(1.8) blur(20px);border-top:.5px solid rgba(0,0,0,.2);position:relative;z-index:20}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:500;color:#8e8e93;letter-spacing:0}
.tabbar button[aria-current="page"]{color:var(--tint)}
.tabbar button[aria-current="page"] svg path{fill:currentColor;fill-opacity:.14}
.scroll{padding:0 16px 28px}
.toast{bottom:104px;border-radius:14px;background:rgba(30,30,32,.92);backdrop-filter:blur(10px)}
/* cards with illustrations */
.mcard .mimg{border-radius:12px;background:#fff}
.mcard .mt{font-size:15px;font-weight:600}
.urgent{padding:14px 16px}
.urgent .k{color:#ff3b30}
.urgent .k::before{background:#ff3b30}
.due{font-size:17px;font-weight:400;color:var(--label2)}
.due.amber{color:#c77700}.due.red{color:#ff3b30}
.steps i.on{background:var(--tint)}
.progress i.on{background:var(--tint)}
.person{padding:14px}
.days{font-family:var(--disp)}
/* sheets as iOS cards */
.sheet-bg{background:rgba(0,0,0,.28);backdrop-filter:none;-webkit-backdrop-filter:none;align-items:flex-end;padding:0}
.sheet{border-radius:14px 14px 0 0;padding:8px 16px 30px;max-height:92%;background:#f2f2f7}
.sheet::before{content:"";display:block;width:36px;height:5px;border-radius:3px;background:#c7c7cc;margin:0 auto 14px}
.sheet .fields{background:#fff;border:0;border-radius:12px}
.sheet .q{color:var(--label2);font-weight:600;font-size:13px;text-transform:uppercase}
.sheet .tech{background:#fff;border-radius:12px;padding:16px}
@media (prefers-reduced-motion:no-preference){@keyframes sheet-in{from{transform:translateY(100%)}to{transform:none}}.sheet{animation:sheet-in .42s var(--ease-drawer) both}}
/* desktop rail: Apple.com-style sans */
.rail .mark{font-family:var(--disp);font-weight:600;font-size:19px}
.statement{font-family:var(--disp);font-weight:700;font-size:40px;line-height:1.08;letter-spacing:-.03em}
.explain .tech h3,.tech h3{font-family:var(--disp);font-weight:700;font-size:24px;letter-spacing:-.02em}
.flows .fn{font-family:var(--sys)}
.word em{display:none}
/* alerts keep their dark look */
.rcb,.rcb-app{border-radius:16px}
.lk-clock,.rcb-clock{font-family:var(--disp);font-weight:600;letter-spacing:-.02em}
.alert h1{font-family:var(--disp);font-weight:700}
.doccard{border-radius:16px}
.doccard .h-m{font-family:var(--disp)}
.qr{border-radius:16px}
.face-i{width:40px;height:40px}
.road .n{font-family:var(--disp);font-weight:700;font-size:20px}
.easy .h-xl{font-size:40px}
.tile{border-radius:16px;font-size:22px}
.done-mark{background:#34c759}

/* ===================== v8 "Atrament" ===================== */
:root{
  --bg:#F4F4F6;--surface:#FFFFFF;--fill:#EDEEF1;--fill-2:#E4E5E9;
  --ink:#0B0D12;--ink-2:#6B7079;--ink-3:#8E939B;--hair:rgba(11,13,18,.08);--hair-2:rgba(11,13,18,.14);
  --red:#C8102E;--red-soft:#FBECEE;--ok:#1A7F4B;--warn:#B25E09;
  --d-0:#0B0D12;--d-1:#111723;--d-2:#1A2233;--d-hair:rgba(255,255,255,.10);--d-ink:#fff;--d-ink-2:#A2A8B3;
  --doc-id:#111723;--doc-drive:#16233F;--doc-car:#16261F;--doc-pass:#34161C;--doc-other:#23262D;
  --e-float:0 8px 28px -8px rgba(11,13,18,.18),0 0 0 .5px rgba(11,13,18,.08);
  --out:cubic-bezier(.22,1,.36,1);--spring:cubic-bezier(.34,1.3,.64,1);
  /* remap legacy tokens so every inner flow inherits the ink system */
  --app:var(--bg);--tint:var(--ink);--blue:var(--ink);--navy:var(--ink);--navy-soft:var(--fill);--purple:var(--ink-2);--purple-soft:var(--fill);
  --green:var(--ok);--green-soft:#E8F3EC;--amber:var(--warn);--amber-soft:#FBF1E4;--muted:var(--ink-2);--faint:var(--ink-3);--label2:var(--ink-2);--sep:var(--hair-2);
  --ink2:var(--ink);--track:var(--fill);--line:transparent;--tile:#fff;
  --sans:"Inter",system-ui,sans-serif;--serif:var(--sans);--sys:var(--sans);--disp:var(--sans)}
html,body,.app,button,input,textarea{font-family:"Inter",system-ui,sans-serif;font-optical-sizing:auto;font-feature-settings:"calt","ss03","cv11";-webkit-font-smoothing:antialiased}
body{letter-spacing:-.011em;color:var(--ink);background:var(--bg)}
:focus-visible{outline-color:var(--ink)}
.stage,.phone,.app{background:var(--bg)}
/* kill uppercase everywhere */
.dateline,.stepk,.sheet .q,.tech .eyebrow,.hk,.bh-date,.caltile .cm,.urgent .k,.eyebrow,.kicker{text-transform:none!important;letter-spacing:0!important}
/* type */
.h-xl{font-size:32px;line-height:36px;font-weight:650;letter-spacing:-.03em;margin:4px 0 16px}
.h-l{font-size:24px;line-height:28px;font-weight:650;letter-spacing:-.025em}
.h-m{font-size:17px;line-height:22px;font-weight:600;letter-spacing:-.015em}
.sec h3{font-size:14px;font-weight:500;color:var(--ink-2);letter-spacing:-.006em}
.sec{margin:32px 4px 8px}
.sec button{color:var(--ink);font-size:14px;font-weight:500}
/* wordmark */
.wm{font-weight:650;font-size:17px;line-height:1;letter-spacing:-.02em;color:var(--ink);display:inline-flex;align-items:center;white-space:nowrap}
.wm .m{font-weight:400;color:var(--ink-2)}
.wm .rz{font-weight:400;color:var(--ink-3);margin-left:6px}
.flag{width:16px;height:11px;border-radius:3px;margin-right:8px;background:linear-gradient(#fff 50%,var(--red) 50%);box-shadow:0 0 0 .5px rgba(11,13,18,.22);display:inline-block;flex:none}
/* chrome */
.statusbar{color:var(--ink)}
.topbar{height:52px;padding:0 20px;background:rgba(244,244,246,.78);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);position:relative;z-index:15}
.word{font-family:inherit;padding:0}
.avatar-btn{width:32px;height:32px;border-radius:50%;background:var(--fill-2);color:var(--ink);font-size:12px;font-weight:600}
.how-btn{background:var(--fill);color:var(--ink);width:32px;height:32px}
.navback{color:var(--ink);font-size:16px;font-weight:500}
.scroll{padding:4px 20px 112px}
.tabbar{position:absolute;left:12px;right:12px;bottom:14px;height:60px;padding:0 6px;border-radius:999px;border:0;
  background:rgba(255,255,255,.80);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);box-shadow:var(--e-float);align-items:center}
.tabbar button{color:var(--ink-3);font-size:10px;font-weight:500;gap:3px;height:100%;justify-content:center}
.tabbar button[aria-current="page"]{color:var(--ink)}
.tabbar button[aria-current="page"] svg{stroke-width:2.1}
.tabbar button[aria-current="page"] svg path{fill:currentColor;fill-opacity:.08}
.toast{bottom:92px;background:var(--ink);border-radius:999px;padding:12px 18px;font-size:14px}
/* buttons */
.btn,.pill{height:52px;border-radius:999px;background:var(--ink);color:#fff;font-size:16px;font-weight:600;padding:0 22px;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;box-shadow:none}
.btn.soft,.pill.soft,.btn.ghost{background:var(--fill);color:var(--ink)}
.btn.black{background:var(--ink)}
.btn.danger,.btn.red{background:var(--red-soft);color:var(--red)}
.pill.wide{width:100%}
.mini{background:var(--fill);color:var(--ink);border-radius:999px}
.link,.tlink{color:var(--ink);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--hair-2)}
@media (prefers-reduced-motion:no-preference){
  button,.grow,.w,.mtile,.doc{transition:transform .16s var(--ease-out),background-color .15s ease}
  button:active,.grow:active,.w:active,.mtile:active{transform:scale(.97);transition-duration:.12s}}
/* segmented */
.seg{background:var(--fill);border-radius:12px;padding:3px;height:40px;gap:0}
.seg button{border-radius:9px;font-size:14px;font-weight:600;color:var(--ink-2);padding:0 14px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(11,13,18,.10)}
.toggle[aria-checked="true"]{background:var(--ink)}
.check[aria-checked="true"]{background:var(--ink);border-color:var(--ink)}
/* legacy surfaces: white on grey, no shadows, no coloured squares */
.card,.list,.person,.tile,.note,.sug,.msg.ai,.levels div,.offline,.map,.urgent,.wg,.ipc,.t3,.demo-b,.hot{border-radius:22px!important;box-shadow:none!important;background:#fff}
.it,.ic,.wic,.face-i,.org{background:var(--fill)!important;color:var(--ink)!important;border-radius:50%!important}
.row{min-height:56px;padding:12px 16px}
.row .t{font-size:16px;font-weight:500;letter-spacing:-.011em}
.row .s{font-size:14px;color:var(--ink-2)}
.row + .row::before,.field + .field::before{background:var(--hair)!important;height:1px!important}
.row .chev,.chev{color:var(--ink-3)}
.pill:not(button){height:auto;background:none;color:inherit;padding:0;font-size:14px;font-weight:500}
.due.red,.row .s.red,.urgent .k{color:var(--red)}
.done-mark{background:var(--ink)}
.progress i.on,.steps i.on{background:var(--ink)}
.spot{background:#fff;border-radius:22px}
.sheet{background:var(--bg);border-radius:22px 22px 0 0}
.sheet-bg{background:rgba(11,13,18,.40)}
.sheet .fields{border-radius:22px}

/* --- shared atoms --- */
.lbl{display:flex;justify-content:space-between;align-items:center;margin:32px 4px 10px;font-size:14px;color:var(--ink-2)}
.lbl button{display:inline-flex;align-items:center;gap:2px;color:var(--ink);font-weight:500;font-size:14px}
.glist{background:#fff;border-radius:22px;overflow:hidden}
.grow{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:10px 16px;text-align:left;position:relative;background:#fff}
.grow.tall{min-height:72px}
.grow + .grow::before{content:"";position:absolute;top:0;right:0;left:68px;height:1px;background:var(--hair)}
.grow:active{background:var(--fill)}
.lead-i{width:40px;height:40px;border-radius:50%;background:var(--fill);display:grid;place-items:center;flex:none;color:var(--ink)}
.gtx{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.gt{font-size:16px;font-weight:500;letter-spacing:-.011em;line-height:22px;display:flex;align-items:center;gap:6px}
.gt.h{font-size:17px;font-weight:600;letter-spacing:-.015em}
.gs{font-size:14px;color:var(--ink-2);line-height:19px}
.gv{font-size:14px;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.gv.red,.red-t{color:var(--red)!important}
.gch{color:var(--ink-3);display:grid;flex:none}
.keyi{color:var(--ink-3);display:inline-grid}
.av{border-radius:50%;background:var(--fill-2);color:var(--ink);font-weight:600;display:grid;place-items:center;flex:none;position:relative;letter-spacing:0}
.avd{position:absolute;right:-1px;bottom:-1px;width:10px;height:10px;border-radius:50%;box-shadow:0 0 0 2px #fff}
.avstack{display:inline-flex}.avstack .av{box-shadow:0 0 0 2px var(--surface);margin-left:-8px}.avstack .av:first-child{margin-left:0}
.ring-c b{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em}.ring-c small{font-size:10px;color:var(--ink-2)}
.chips{display:flex;gap:8px;overflow-x:auto;margin:12px -20px 0;padding:0 20px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;height:34px;padding:0 14px;border-radius:999px;background:var(--fill);color:var(--ink);font-size:14px;font-weight:500}
.chips button[aria-pressed="true"]{background:var(--ink);color:#fff}
.search{background:var(--fill);border-radius:12px;height:44px;color:var(--ink-3)}
.search input{font-size:16px}
/* --- document card --- */
.flipwrap{perspective:1200px;position:relative;aspect-ratio:1.586;margin-top:4px}
.doc{position:relative;display:flex;flex-direction:column;justify-content:space-between;width:100%;aspect-ratio:1.586;border-radius:18px;padding:16px 18px;color:var(--d-ink);text-align:left;overflow:hidden;
  --tone:var(--doc-id);
  background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.10) 46%,rgba(255,255,255,.02) 54%,transparent 68%) var(--sx,0%) 0/220% 100% no-repeat,
   repeating-radial-gradient(circle at 82% 118%,rgba(255,255,255,.045) 0 1px,transparent 1px 7px),
   linear-gradient(150deg,var(--d-2),var(--tone) 60%);
  box-shadow:inset 0 0 0 1px var(--d-hair),inset 0 1px 0 rgba(255,255,255,.16),0 1px 2px rgba(11,13,18,.20),0 18px 36px -18px rgba(11,13,18,.45)}
.tone-drive{--tone:var(--doc-drive)}.tone-car{--tone:var(--doc-car)}.tone-pass{--tone:var(--doc-pass)}.tone-other{--tone:var(--doc-other)}
.tone-pass,.tone-car,.tone-drive{background-image:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.10) 46%,rgba(255,255,255,.02) 54%,transparent 68%),repeating-radial-gradient(circle at 82% 118%,rgba(255,255,255,.045) 0 1px,transparent 1px 7px),linear-gradient(150deg,color-mix(in srgb,var(--tone) 70%,#3a4254),var(--tone) 60%)}
.flipwrap > .doc{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;transform:rotateY(var(--rx,0deg));transition:transform .52s var(--out),filter .52s}
.flipwrap .doc-back{transform:rotateY(180deg);display:flex;flex-direction:row;align-items:center;gap:16px;justify-content:flex-start}
.flipwrap.flipped > .doc:first-child{transform:rotateY(-180deg)}
.flipwrap.flipped .doc-back{transform:rotateY(0)}
.d-top,.d-bot{display:flex;justify-content:space-between;align-items:center}
.d-rp{display:inline-flex;align-items:center;font-size:12px;font-weight:500;color:var(--d-ink)}
.d-rp .flag{width:14px;height:10px;margin-right:7px;box-shadow:none}
.d-kind{font-size:13px;font-weight:500;color:var(--d-ink-2)}
.d-mid{display:flex;gap:14px;align-items:center}
.dphoto{width:56px;height:72px;border-radius:8px;overflow:hidden;box-shadow:0 0 0 1px var(--d-hair);flex:none;display:block}
.d-name{font-size:20px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.d-f{display:flex;gap:18px;margin-top:8px}
.d-f span{display:block;font-size:11px;font-weight:500;color:var(--d-ink-2)}
.d-f b{font-size:15px;font-weight:500;font-variant-numeric:tabular-nums}
.d-chip{height:24px;padding:0 10px;border-radius:999px;background:rgba(255,255,255,.12);font-size:12px;font-weight:500;display:inline-flex;align-items:center;color:#fff}
.d-live{font-size:11px;font-variant-numeric:tabular-nums;color:var(--d-ink-2);display:inline-flex;align-items:center;gap:6px}
.d-live i{width:6px;height:6px;border-radius:50%;background:#34c27a}
.qrbox{background:#fff;border-radius:12px;padding:8px;flex:none;line-height:0}
.qr-s{font-size:13px;color:var(--d-ink-2);margin-top:6px;line-height:18px;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:no-preference){.screen .flipwrap > .doc:first-child{animation:sheen .9s var(--out) .15s both}@keyframes sheen{from{background-position:100% 0,0 0,0 0}to{background-position:0% 0,0 0,0 0}}}
/* --- Dziś --- */
.hi-d{font-size:14px;color:var(--ink-2);margin:8px 4px 0}
.today8 .h-xl{margin:2px 4px 18px}
.qa8{display:grid;grid-template-columns:repeat(4,1fr);margin-top:20px}
.qa8 button{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;font-weight:500;color:var(--ink)}
.qa8-i{width:52px;height:52px;border-radius:50%;background:var(--fill-2);display:grid;place-items:center}
.attn{display:flex;gap:14px;align-items:center;background:#fff;border-radius:22px 22px 0 0;padding:16px 16px 4px}
.attn-tx .gt{font-size:17px;font-weight:600;letter-spacing:-.015em}
.attn-act{display:flex;gap:8px;background:#fff;border-radius:0 0 22px 22px;padding:12px 16px 16px}
.attn-act .pill{height:36px;font-size:14px;padding:0 16px}
.w8{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.w{position:relative;background:#fff;border-radius:22px;padding:16px;min-height:132px;display:flex;flex-direction:column;text-align:left;color:var(--ink)}
.wk{font-size:12px;font-weight:500;color:var(--ink-2);padding-right:26px;line-height:16px}
.wico{position:absolute;top:14px;right:14px;color:var(--ink);display:grid}
.wv{font-size:28px;line-height:30px;font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums;margin-top:auto}
.wv small{font-size:14px;font-weight:500;color:var(--ink-2);letter-spacing:-.01em}
.ws{font-size:13px;color:var(--ink-2);margin-top:3px;line-height:17px}
.wav{margin-top:auto}
.wbar{height:3px;border-radius:2px;background:var(--fill-2);margin-top:8px;overflow:hidden}.wbar i{display:block;height:100%;background:var(--ink);border-radius:2px}
.mrow{display:flex;gap:12px;overflow-x:auto;margin:0 -20px;padding:0 20px 4px;scroll-snap-type:x mandatory;scrollbar-width:none}.mrow::-webkit-scrollbar{display:none}
.mtile{flex:0 0 148px;height:168px;scroll-snap-align:start;background:#fff;border-radius:22px;padding:12px 14px 14px;display:flex;flex-direction:column;text-align:left;color:var(--ink)}
.mt-ill{flex:1;display:grid;place-items:center}
.mt-t{font-size:15px;font-weight:600;letter-spacing:-.015em}
.mt-s{font-size:12px;color:var(--ink-2);line-height:16px;margin-top:1px}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.mgrid .mtile{height:176px}
.foot{font-size:12px;color:var(--ink-3);text-align:center;margin-top:28px}
/* --- Bliscy --- */
.fhead{display:flex;align-items:center;gap:12px;margin:-4px 4px 16px;font-size:14px;color:var(--ink-2)}
/* --- Dokumenty stack --- */
.stack{position:relative;transition:height .32s var(--out)}
.stack.has-sel{height:0}
.scard{position:absolute!important;left:0;right:0;top:0;justify-content:flex-start;gap:6px;transform-origin:50% 0;transition:transform .42s var(--spring)!important}
.scard .d-bot{margin-top:auto}
.sc-t{font-size:15px;font-weight:600;letter-spacing:-.01em}
.sc-s{font-size:14px;color:var(--d-ink-2)}
.scard:active{filter:brightness(1.1)}
.stack:not(.has-sel) .scard:hover{transform:translateY(var(--y)) }
/* --- Ochrona --- */
.status{position:relative;overflow:hidden;background:#fff;border-radius:22px;padding:20px;isolation:isolate}
.st-k{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:500;color:var(--ink-2)}
.pulse-dot{background:var(--ok)}
.st-city{font-size:32px;line-height:36px;font-weight:650;letter-spacing:-.03em;margin-top:14px}
.st-calm{font-size:17px;font-weight:600;color:var(--ink-2);letter-spacing:-.015em}
.st-people{border-top:1px solid var(--hair);margin-top:16px;padding-top:4px}
.st-p{display:flex;gap:12px;align-items:center;width:100%;padding:8px 0;text-align:left;color:inherit}
.st-p .gt{font-size:15px}.st-p .gs{font-size:13px}
.sdot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--ok)}.sdot.warn{background:var(--warn)}
.st-warn{display:flex;gap:10px;align-items:baseline;font-size:13px;color:var(--ink-2);border-top:1px solid var(--hair);padding-top:12px;margin-top:6px}
.st-flood{position:absolute;inset:0;background:var(--red);z-index:-1;clip-path:circle(0 at 26px 26px);transition:clip-path .48s var(--out)}
.status.flood{color:#fff}.status.flood .st-flood{clip-path:circle(150% at 26px 26px)}
.status.flood .st-k,.status.flood .st-calm,.status.flood .gs,.status.flood .st-warn{color:rgba(255,255,255,.85)}
.status.flood .st-people,.status.flood .st-warn{border-color:rgba(255,255,255,.2)}
/* --- Illustrations: ink line --- */
.ill path[stroke-dasharray]{opacity:.5}
/* --- legacy alerts stay dark/red but in the new reds --- */
.alert.red,.rcb{background-color:var(--red)}

/* --- desktop presentation --- */
.stage.wide{position:relative;grid-template-columns:minmax(300px,420px) 392px minmax(220px,300px);gap:72px;padding-top:96px;padding-bottom:56px}
.top8{position:absolute;top:28px;left:40px;right:40px;display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--ink-2)}
.rail{gap:0}
.rail .statement{font-size:56px;line-height:58px;font-weight:650;letter-spacing:-.04em;margin:0;max-width:9.5em;text-wrap:balance}
.sub8{font-size:18px;line-height:26px;color:var(--ink-2);margin:18px 0 0;max-width:30em}
.cta8{display:flex;align-items:center;gap:14px;margin:26px 0 36px}
.cta8 .keys{font-size:13px;color:var(--ink-3)}
.explain{border-top:1px solid var(--hair-2);padding-top:22px}
.explain .tech h3{font-size:24px;line-height:28px;font-weight:650;letter-spacing:-.025em;margin:4px 0 14px}
.tech .eyebrow{font-size:13px;font-weight:500;color:var(--ink-2)}
.tnode .dot{background:var(--fill)!important;color:var(--ink);font-variant-numeric:tabular-nums}
.explain .tnode:not(:last-child)::before{background:var(--hair-2)}
.tech .sys{font-weight:600}
.tech .what{color:var(--ink-2)}
.tag-j,.tag-n,.tag-a{color:var(--ink-2)!important;font-weight:500}
.tag-j::before{background:var(--ink)!important}.tag-n::before{background:transparent!important;box-shadow:inset 0 0 0 1.5px var(--ink-3)}.tag-a::before{background:var(--ink-3)!important}
.tech .legend{display:none}
.phone{border-radius:56px;box-shadow:0 0 0 1px #1A1C22,0 0 0 9px #0B0D12,0 0 0 10px #2A2D35,0 60px 120px -40px rgba(11,13,18,.35)}

@media (prefers-reduced-motion:no-preference){.guide-tip span{animation:tip-in .22s cubic-bezier(.23,1,.32,1) both}.guide-tip.below span{animation-name:tip-in-b}}
.srch8:has(input:not(:placeholder-shown)) ~ *{display:none}
.grow.guide8,.row.guide8,.how8-row.guide8{outline-offset:-3px;border-radius:16px}
.how8-row .lead-i{width:30px;height:30px;border-radius:10px}
/* Dziś: search + inbox row under the greeting (Karl, 26 Nov) */
.hdr9{display:flex;gap:10px;align-items:center;margin:14px 0 16px}
.hdr9-s{flex:1;min-width:0;display:flex;align-items:center;gap:8px;height:44px;padding:0 14px;border-radius:14px;background:var(--surface);box-shadow:inset 0 0 0 .5px var(--hair);color:var(--label2,#8a8f99);font-size:15px;text-align:left;transition:transform .16s var(--out)}
.hdr9-s span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.hdr9-i{position:relative;flex:none;width:44px;height:44px;border-radius:14px;background:var(--surface);display:grid;place-items:center;box-shadow:inset 0 0 0 .5px var(--hair);transition:transform .16s var(--out)}
.hdr9-s:active,.hdr9-i:active{transform:scale(.97)}
.hdr9-i b{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;box-shadow:0 0 0 2px var(--bg)}
/* reserve the tip's space up front so the Dalej button never jumps (Karl, 26 Nov) */
.story:not(:has(.st-next.ready)) .st-done{display:block!important;visibility:hidden}
.story .st-nav,.story:has(.st-next.ready) .st-nav{margin-top:50px}

function QR() {
  const cells = []; let seed = 7;
  for (let y = 0; y < 21; y++) for (let x = 0; x < 21; x++) {
    seed = (seed * 9301 + 49297) % 233280;
    const finder = (x < 7 && y < 7) || (x > 13 && y < 7) || (x < 7 && y > 13);
    const on = finder ? ((x % 14 === 0 || x % 14 === 6 || y % 14 === 0 || y % 14 === 6) || ((x % 14) > 1 && (x % 14) < 5 && (y % 14) > 1 && (y % 14) < 5)) : seed / 233280 > .52;
    if (on) cells.push(html`<rect x=${x} y=${y} width="1" height="1"/>`);
  }
  return html`<svg viewBox="0 0 21 21" width="100%" height="100%" fill="#101317" role="img" aria-label="Kod QR (przykład)">${cells}</svg>`;
}

function Assistant(c) {
  const [msgs, setMsgs] = useState(c.s.q ? [] : []);

  };
  useEffect(() => { if (c.s.q) { ask(c.s.q); c.set({ q: null }); } }, []);
  useEffect(() => { endRef.current && endRef.current.scrollIntoView({ block: 'end' }); }, [msgs]);
  return html`<div style="display:flex;flex-direction:column;gap:12px">

const useClock = () => {
  const [t, setT] = useState(() => 7);
  useEffect(() => { const i = setInterval(() => setT(x => x + 1), 1000); return () => clearInterval(i); }, []);
  const m = 40 + Math.floor(t / 60), sec = t % 60;
  return `15:${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
};
const QRCode = ({ size = 132 }) => {
  const n = 25, cells = []; let seed = 7;
  const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  const finder = (x, y) => (x < 7 && y < 7) || (x >= n - 7 && y < 7) || (x < 7 && y >= n - 7);
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) if (!finder(x, y) && rnd() > .52) cells.push(html`<rect x=${x} y=${y} width="1" height="1"/>`);
  const F = (x, y) => html`<g><rect x=${x} y=${y} width="7" height="7" rx="1.6"/><rect x=${x + 1} y=${y + 1} width="5" height="5" rx="1" fill="#fff"/><rect x=${x + 2} y=${y + 2} width="3" height="3" rx=".6"/></g>`;
  return html`<svg width=${size} height=${size} viewBox=${`-1 -1 ${n + 2} ${n + 2}`} fill="#0B0D12" shape-rendering="crispEdges">${cells}${F(0, 0)}${F(n - 7, 0)}${F(0, n - 7)}</svg>`;
};

const ROSETTE = html`<svg class="rosette" viewBox="-100 -100 200 200" aria-hidden="true">${Array.from({ length: 36 }, (_, i) => html`<ellipse rx="92" ry="34" transform=${`rotate(${i * 5})`}/>`)}</svg>`;

function DocCard({ c, tone = 'id', interactive = true }) {
  const [flip, setFlip] = useState(false);
  const [left, setLeft] = useState(179);
  const clock = useClock();
  const ref = useRef(null);
  useEffect(() => { if (!flip) return; setLeft(179); const i = setInterval(() => setLeft(x => Math.max(0, x - 1)), 1000); return () => clearInterval(i); }, [flip]);
  const move = e => { const el = ref.current; if (!el) return; const r = el.getBoundingClientRect(); const x = (e.clientX - r.left) / r.width; el.style.setProperty('--sx', (100 - x * 100).toFixed(1) + '%'); el.style.setProperty('--rx', ((x - .5) * 6).toFixed(2) + 'deg'); };
  const leave = () => { const el = ref.current; if (el) { el.style.removeProperty('--rx'); } };
  return html`<div class=${'flipwrap' + (flip ? ' flipped' : '')}>
    <button class=${'doc tone-' + tone} ref=${ref} onPointerMove=${interactive ? move : null} onPointerLeave=${leave} onClick=${() => interactive && setFlip(true)} aria-label="Dowód osobisty, dotknij aby pokazać kod QR">${ROSETTE}

    </button>

      <div class="qrbox"><${QRCode} size=${118}/></div>
      <div class="qr-tx"><div class="d-name" style="font-size:17px">Pokaż kod do zeskanowania</div><div class="qr-s">Kod ważny ${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')}. Zobaczysz, kto sprawdza, zanim pokażesz dane.</div>

    </div>
  </div>`;
}

function useTicker(max, ms) {
  const [n, setN] = useState(0);
  useEffect(() => { if (n >= max) return; const t = setTimeout(() => setN(n + 1), n === 0 ? 500 : ms); return () => clearTimeout(t); }, [n]);
  return [n, () => setN(0)];
}

  const p = { anna: ['AN', '#22408f', 'Ty'], zosia: ['ZN', '#b0533f', 'Zosia'], tomasz: ['TN', '#3d5a80', 'Tomasz'], tata: ['SN', '#1c7a4c', 'Tata'] }[who];
  return html`<div class="lfam"><span class="av" style=${'background:' + p[1]}>${p[0]}<i class=${'st ' + tone}></i></span><span class="nm">${p[2]}</span><span class="ss">${st}</span></div>`;
}

/* ---- Zegarek prowadzi: the shelter card becomes a watch face ---- */
const LEGS = [
  { a: 0, d: 240, t: 'Prosto ulicą Długą' },
  { a: 90, d: 140, t: 'W prawo w Dekerta', taps: 3, side: 'r' },
  { a: -90, d: 40, t: 'W lewo, do bramy nr 24', taps: 2, side: 'l' },
  { end: true }
];
function AlertWatch(c) {
  const [k, setK] = useState(0);
  const [dist, setDist] = useState(240);
  const [ping, setPing] = useState(0);
  const face = useRef(null), root = useRef(null);
  /* shared-element morph from the red shelter card */
  (htmPreact.useLayoutEffect || useEffect)(() => {
    const f = face.current, from = window.__morph; window.__morph = null;
    if (!f || !from || rmo()) return;
    const ph = document.querySelector('.phone'); const pr = ph.getBoundingClientRect(); const sx = pr.width / ph.offsetWidth || 1;
    const to = f.getBoundingClientRect();
    const dx = ((from.left + from.width / 2) - (to.left + to.width / 2)) / sx, dy = ((from.top + from.height / 2) - (to.top + to.height / 2)) / sx;
    f.animate([{ transform: `translate(${dx}px,${dy}px) scale(${from.width / to.width},${from.height / to.height})`, borderRadius: '18px', background: '#fff' }, { transform: 'none', borderRadius: '50%', background: '#050608' }], { duration: 620, easing: 'cubic-bezier(.32,.72,0,1)' });
  }, []);
  useEffect(() => {
    if (k >= LEGS.length - 1) return;
    const leg = LEGS[k];
    if (leg.taps) { setPing(p => p + 1); buzz(Array.from({ length: leg.taps * 2 - 1 }, (_, i) => i % 2 ? 90 : 45)); }
    const end = LEGS[k + 1].d || 0;
    const tick = setInterval(() => setDist(d => Math.max(end, d - 5)), 2300 / Math.max(1, (leg.d - end) / 5));
    const nx = setTimeout(() => { setK(k + 1); if (k + 1 === LEGS.length - 1) { setDist(0); buzz([60, 60, 200]); fire(); } }, k === 0 ? 2600 : 2400);
    return () => { clearInterval(tick); clearTimeout(nx); };
  }, [k]);
  const leg = LEGS[k], arrived = !!leg.end;
  const prog = arrived ? 1 : 1 - dist / 240;
  const C = 2 * Math.PI * 104;
  const open = () => {
    const f = face.current;
    if (!f || rmo()) { c.go('alert-guide'); return; }
    root.current && root.current.classList.add('leaving');
    f.animate([{ transform: 'none', borderRadius: '50%' }, { transform: 'scale(4.2)', borderRadius: '30%' }], { duration: 420, easing: 'cubic-bezier(.32,.72,0,1)', fill: 'forwards' });
    setTimeout(() => c.go('alert-guide'), 360);
  };
  return html`<div class="wt8" ref=${root} role="region" aria-label="Zegarek prowadzi do schronienia">
    <div class="wt-cap"><span class="wt-pocket">${I('phone', 16)}</span>Telefon w kieszeni. Prowadzi zegarek.</div>
    <div class="wt-stage">
      <div class="wt-strap top"></div><div class="wt-strap bot"></div>
      <div class="wt-case"><span class="wt-crown"></span>
        <div class="wt-face" ref=${face}>
          <svg class="wt-ring" viewBox="0 0 220 220" aria-hidden="true"><circle cx="110" cy="110" r="104" stroke="rgba(255,255,255,.1)" stroke-width="7" fill="none"/>
            <circle cx="110" cy="110" r="104" stroke="#E0263F" stroke-width="7" fill="none" stroke-linecap="round" stroke-dasharray=${C} stroke-dashoffset=${C * (1 - prog)} transform="rotate(-90 110 110)" class="wt-prog"/></svg>
          ${arrived ? html`<div class="wt-in done"><span class="wt-ok">${I('check', 40)}</span><b>Jesteś w schronie</b><small>Dekerta 24 · poziom -1</small></div>`
            : html`<div class="wt-in"><span class="wt-arrow" style=${`transform:rotate(${leg.a}deg)`}><svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20V5M5.5 11.5 12 5l6.5 6.5"/></svg></span>
              <b class="wt-d">${dist} m</b><small>${leg.t}</small></div>`}
        </div>
      </div>
      ${leg.taps && html`<div key=${ping} class=${'wt-hap ' + leg.side}><i></i><i></i><span>${Array.from({ length: leg.taps }, () => 'stuk').join(' · ')}</span></div>`}
    </div>
    <div class="wt-legend">${arrived ? 'Zegarek stuknął trzy razy długo: jesteś na miejscu.' : 'Dwa stuknięcia: w lewo. Trzy: w prawo. Bez patrzenia na ekran.'}</div>
    <div style="flex:1"></div>
    ${arrived && html`<div class="actions"><button class="btn" onClick=${open}>Otwórz w telefonie</button></div>`}
  </div>`;
}

const COACHED = new WeakSet(), USED = new Set();
/* apply once per frame and only on a real change, so the tip never blinks when coach() re-runs (Karl, 26 Nov) */
let readyWant = false, readyRaf = 0;
const setReady = v => { readyWant = v; cancelAnimationFrame(readyRaf); readyRaf = requestAnimationFrame(() => document.querySelectorAll('.st-next, .ms-next').forEach(e => { if (e.classList.contains('ready') !== readyWant) e.classList.toggle('ready', readyWant); })); };
let tipRaf = 0;
function coachTip(ph, el) {
  cancelAnimationFrame(tipRaf);
  document.querySelectorAll('.coach-tip').forEach(t => t.remove());
  if (!ph || !el) return;
  const tip = document.createElement('div'); tip.className = 'coach-tip'; tip.setAttribute('aria-hidden', 'true');
  tip.innerHTML = '<span>Dotknij tutaj</span>'; ph.appendChild(tip);
  const tick = () => {
    if (!el.isConnected || !el.classList.contains('coach')) { tip.remove(); return; }
    const z = parseFloat(getComputedStyle(ph).zoom) || 1;
    const pr = ph.getBoundingClientRect(), r = el.getBoundingClientRect();
    const sx = pr.width / ph.offsetWidth || 1;
    const x = (r.left + r.width / 2 - pr.left) / sx, top = (r.top - pr.top) / sx, bot = (r.bottom - pr.top) / sx;
    const below = top < 56;
    tip.classList.toggle('below', below);
    const sp = tip.firstChild, w = sp.offsetWidth || 110, W = ph.offsetWidth, m = 10;
    const cx = Math.min(Math.max(x, w / 2 + m), W - w / 2 - m);
    tip.style.setProperty('--dx', Math.round(cx - x) + 'px');
    tip.style.transform = `translate(${Math.round(x)}px, ${Math.round(below ? bot + 12 : top - 12)}px)`;
    const vis = bot > 40 && top < ph.offsetHeight - 40;
    tip.style.opacity = vis ? '' : '0';
    tipRaf = requestAnimationFrame(tick);
  };
  tick();
}

/* Hop 16: swipe from the left edge to go back, like every iOS app */
function edgeBack(e, back) {
  const sc = e.currentTarget, r = sc.getBoundingClientRect();
  if (e.button > 0 || e.clientX - r.left > 22) return;
  const scr = sc.querySelector('.screen'); if (!scr) return;
  const x0 = e.clientX; let dx = 0, on = false; const W = r.width;
  const mv = ev => { const d = ev.clientX - x0; if (!on) { if (d < 8) return; on = true; sc.setPointerCapture(e.pointerId); scr.style.transition = 'none'; sc.classList.add('edge'); }
    dx = Math.max(0, d); scr.style.transform = `translateX(${dx}px)`; scr.style.boxShadow = '-12px 0 30px -12px rgba(0,0,0,.25)'; };
  const up = () => { sc.removeEventListener('pointermove', mv); sc.removeEventListener('pointerup', up); sc.removeEventListener('pointercancel', up); if (!on) return; sc.classList.remove('edge');
    if (dx > W * .33) { scr.animate([{ transform: `translateX(${dx}px)` }, { transform: `translateX(${W}px)` }], { duration: 180, easing: 'cubic-bezier(.32,.72,0,1)', fill: 'forwards' }); setTimeout(back, 170); }
    else { scr.animate([{ transform: `translateX(${dx}px)` }, { transform: 'none' }], { duration: 260, easing: 'cubic-bezier(.32,.72,0,1)' }); scr.style.transform = ''; scr.style.boxShadow = ''; } };
  sc.addEventListener('pointermove', mv); sc.addEventListener('pointerup', up); sc.addEventListener('pointercancel', up);
}
